version: 1.0.0
dotfiles_dir: ~/.dotfiles
apps:
    antigravity-cli:
        description: Google Antigravity CLI (agy) for agent orchestration in the terminal
        profile: core,ai
        check: [agy]
        install:
            darwin: {manager: brew, cask: antigravity-cli}
    atuin:
        description: Atuin shell history sync configuration
        profile: core
        paths:
            - src: ~/.config/atuin/config.toml
              dest: configs/atuin/config.toml
        install:
            darwin:
                manager: brew
                package: atuin
            brew:
                manager: brew
                package: atuin
            pacman:
                manager: pacman
                package: atuin
            apt:
                manager: apt
                package: atuin
            dnf:
                manager: dnf
                package: atuin
    brew:
        description: Core Brewfile (packages are installed through their own apps)
        profile: core
        paths:
            - src: Brewfile
              dest: Brewfile
    claude:
        description: Claude Code CLI settings, MCP servers, agents, and instructions
        profile: core,ai
        paths:
            - src: ~/.claude/settings.json
              dest: configs/claude/settings.json
            - src: ~/.claude/mcp.json
              dest: configs/claude/mcp.json
            - src: ~/.claude/CLAUDE.md
              dest: configs/claude/CLAUDE.md
            - src: ~/.claude/skills
              dest: configs/claude/skills
            - src: ~/.claude/agents
              dest: configs/claude/agents
            - src: ~/.claude/commands
              dest: configs/claude/commands
            - src: ~/.claude/output-styles
              dest: configs/claude/output-styles
            - src: ~/.claude/hooks
              dest: configs/claude/hooks
            - src: ~/.claude/keybindings.json
              dest: configs/claude/keybindings.json
        secrets:
            - mcp.json
        exclude:
            - session-env/**
            - sessions/**
            - history.jsonl
            - file-history/**
            - daemon.log
            - cache/**
            - backups/**
            - '*.tmp.*'
            - '*.backup'
            - .DS_Store
        requires:
            - node
        install:
            darwin:
                manager: brew
                cask: claude-code
            default:
                manager: npm
                package: "@anthropic-ai/claude-code"
    codex:
        description: Codex CLI configurations, hooks, agents, and rules
        profile: core,ai
        paths:
            - src: ~/.codex/config.toml
              dest: configs/codex/config.toml
            - src: ~/.codex/hooks.json
              dest: configs/codex/hooks.json
            - src: ~/.codex/AGENTS.md
              dest: configs/codex/AGENTS.md
            - src: ~/.codex/rules
              dest: configs/codex/rules
            - src: ~/.codex/skills
              dest: configs/codex/skills
            # Files config.toml and hooks.json reference by path.
            - src: ~/.codex/engram-instructions.md
              dest: configs/codex/engram-instructions.md
            - src: ~/.codex/engram-compact-prompt.md
              dest: configs/codex/engram-compact-prompt.md
            - src: ~/.codex/herdr-agent-state.sh
              dest: configs/codex/herdr-agent-state.sh
        exclude:
            - '*.sqlite*'
            - cache/**
            - sessions/**
            - archived_sessions/**
            - history.jsonl
            - models_cache.json
            - log/**
            - .tmp/**
            - .DS_Store
        secrets:
            - auth.json
        requires:
            - node
        install:
            darwin:
                manager: brew
                cask: codex
            default:
                manager: npm
                package: "@openai/codex"
    engram:
        description: Persistent cross-session memory engine for AI coding agents
        profile: core,ai
        paths:
            - src: ~/.engram/protocol-mode.json
              dest: configs/engram/protocol-mode.json
        exclude:
            - '*.db*'
            - '*.lock'
            - .instance-id*
        install:
            darwin:
                manager: brew
                package: gentleman-programming/tap/engram
            brew:
                manager: brew
                package: gentleman-programming/tap/engram
    gentle-ai:
        description: Gentle AI development workflow harness (ODD, SDD, 4R Review, Judgment Day)
        profile: core,ai
        paths:
            - src: ~/.gentle-ai/state.json
              dest: configs/gentle-ai/state.json
        exclude:
            - cache/**
            - backups/**
            - review-contexts/**
            - '*.lock'
            - .DS_Store
        install:
            darwin:
                manager: brew
                package: gentleman-programming/tap/gentle-ai
            brew:
                manager: brew
                package: gentleman-programming/tap/gentle-ai
    gentle-shell:
        description: Gentle Shell agent home (settings, models, MCP servers, skills, agents, chains, extensions)
        profile: core,ai
        paths:
            - src: ~/.gentle-shell/agent/settings.json
              dest: configs/gentle-shell/settings.json
            - src: ~/.gentle-shell/agent/models.json
              dest: configs/gentle-shell/models.json
            - src: ~/.gentle-shell/agent/mcp.json
              dest: configs/gentle-shell/mcp.json
            - src: ~/.gentle-shell/agent/trust.json
              dest: configs/gentle-shell/trust.json
            - src: ~/.gentle-shell/agent/web-search.json
              dest: configs/gentle-shell/web-search.json
            - src: ~/.gentle-shell/agent/claude-bridge.json
              dest: configs/gentle-shell/claude-bridge.json
            - src: ~/.gentle-shell/agent/subagents.json
              dest: configs/gentle-shell/subagents.json
              keep_local: true
            - src: ~/.gentle-shell/agent/skills
              dest: configs/gentle-shell/skills
            - src: ~/.gentle-shell/agent/agents
              dest: configs/gentle-shell/agents
            - src: ~/.gentle-shell/agent/chains
              dest: configs/gentle-shell/chains
            - src: ~/.gentle-shell/agent/extensions
              dest: configs/gentle-shell/extensions
            - src: ~/.gentle-shell/agent/keybindings.json
              dest: configs/gentle-shell/keybindings.json
            - src: ~/.gentle-shell/agent/AGENTS.md
              dest: configs/gentle-shell/AGENTS.md
            - src: ~/.gentle-shell/agent/AGENTS.override.md
              dest: configs/gentle-shell/AGENTS.override.md
            - src: ~/.gentle-shell/agent/CLAUDE.md
              dest: configs/gentle-shell/CLAUDE.md
            - src: ~/.gentle-shell/agent/SYSTEM.md
              dest: configs/gentle-shell/SYSTEM.md
            - src: ~/.gentle-shell/agent/APPEND_SYSTEM.md
              dest: configs/gentle-shell/APPEND_SYSTEM.md
            - src: ~/.gentle-shell/agent/prompts
              dest: configs/gentle-shell/prompts
            - src: ~/.gentle-shell/agent/themes
              dest: configs/gentle-shell/themes
            # Gentle Shell preferences: the bundled install reads config/gentle-ai,
            # the standalone launcher gentle-ai. Only named preference files
            # travel; these folders also hold builds, scratch, telemetry and
            # permission authority (runtime-guardrails, permission-mode).
            - src: ~/.gentle-shell/config/gentle-ai/animations.json
              dest: configs/gentle-shell/config/gentle-ai/animations.json
            - src: ~/.gentle-shell/config/gentle-ai/background-subagents.json
              dest: configs/gentle-shell/config/gentle-ai/background-subagents.json
            - src: ~/.gentle-shell/config/gentle-ai/banner.json
              dest: configs/gentle-shell/config/gentle-ai/banner.json
            - src: ~/.gentle-shell/config/gentle-ai/builtin-codemode-optout.json
              dest: configs/gentle-shell/config/gentle-ai/builtin-codemode-optout.json
            - src: ~/.gentle-shell/config/gentle-ai/double-esc-cancel.json
              dest: configs/gentle-shell/config/gentle-ai/double-esc-cancel.json
            - src: ~/.gentle-shell/config/gentle-ai/history-capture.json
              dest: configs/gentle-shell/config/gentle-ai/history-capture.json
            - src: ~/.gentle-shell/config/gentle-ai/keymaps.json
              dest: configs/gentle-shell/config/gentle-ai/keymaps.json
            - src: ~/.gentle-shell/config/gentle-ai/models.json
              dest: configs/gentle-shell/config/gentle-ai/models.json
            - src: ~/.gentle-shell/config/gentle-ai/notifications.json
              dest: configs/gentle-shell/config/gentle-ai/notifications.json
            - src: ~/.gentle-shell/config/gentle-ai/persona.json
              dest: configs/gentle-shell/config/gentle-ai/persona.json
            - src: ~/.gentle-shell/config/gentle-ai/profile-fallbacks.json
              dest: configs/gentle-shell/config/gentle-ai/profile-fallbacks.json
            - src: ~/.gentle-shell/config/gentle-ai/profiles.json
              dest: configs/gentle-shell/config/gentle-ai/profiles.json
            - src: ~/.gentle-shell/config/gentle-ai/profiles.export.json
              dest: configs/gentle-shell/config/gentle-ai/profiles.export.json
            - src: ~/.gentle-shell/config/gentle-ai/star-prompt.json
              dest: configs/gentle-shell/config/gentle-ai/star-prompt.json
            - src: ~/.gentle-shell/config/gentle-ai/vim.json
              dest: configs/gentle-shell/config/gentle-ai/vim.json
            - src: ~/.gentle-shell/config/gentle-ai/visual-customization.json
              dest: configs/gentle-shell/config/gentle-ai/visual-customization.json
            - src: ~/.gentle-shell/config/gentle-ai/visual-profiles.json
              dest: configs/gentle-shell/config/gentle-ai/visual-profiles.json
            - src: ~/.gentle-shell/gentle-ai/animations.json
              dest: configs/gentle-shell/gentle-ai/animations.json
            - src: ~/.gentle-shell/gentle-ai/background-subagents.json
              dest: configs/gentle-shell/gentle-ai/background-subagents.json
            - src: ~/.gentle-shell/gentle-ai/banner.json
              dest: configs/gentle-shell/gentle-ai/banner.json
            - src: ~/.gentle-shell/gentle-ai/builtin-codemode-optout.json
              dest: configs/gentle-shell/gentle-ai/builtin-codemode-optout.json
            - src: ~/.gentle-shell/gentle-ai/double-esc-cancel.json
              dest: configs/gentle-shell/gentle-ai/double-esc-cancel.json
            - src: ~/.gentle-shell/gentle-ai/history-capture.json
              dest: configs/gentle-shell/gentle-ai/history-capture.json
            - src: ~/.gentle-shell/gentle-ai/keymaps.json
              dest: configs/gentle-shell/gentle-ai/keymaps.json
            - src: ~/.gentle-shell/gentle-ai/models.json
              dest: configs/gentle-shell/gentle-ai/models.json
            - src: ~/.gentle-shell/gentle-ai/notifications.json
              dest: configs/gentle-shell/gentle-ai/notifications.json
            - src: ~/.gentle-shell/gentle-ai/persona.json
              dest: configs/gentle-shell/gentle-ai/persona.json
            - src: ~/.gentle-shell/gentle-ai/profile-fallbacks.json
              dest: configs/gentle-shell/gentle-ai/profile-fallbacks.json
            - src: ~/.gentle-shell/gentle-ai/profiles.json
              dest: configs/gentle-shell/gentle-ai/profiles.json
            - src: ~/.gentle-shell/gentle-ai/profiles.export.json
              dest: configs/gentle-shell/gentle-ai/profiles.export.json
            - src: ~/.gentle-shell/gentle-ai/star-prompt.json
              dest: configs/gentle-shell/gentle-ai/star-prompt.json
            - src: ~/.gentle-shell/gentle-ai/vim.json
              dest: configs/gentle-shell/gentle-ai/vim.json
            - src: ~/.gentle-shell/gentle-ai/visual-customization.json
              dest: configs/gentle-shell/gentle-ai/visual-customization.json
            - src: ~/.gentle-shell/gentle-ai/visual-profiles.json
              dest: configs/gentle-shell/gentle-ai/visual-profiles.json
        exclude:
            - sessions/**
            - web-search-cache/**
            - '*.log'
            - '*.bak*'
            - '*.bk*'
            - '*.tmp.*'
            - '*.cache.json'
            - crashes.json
            - npm/**
            - bin/**
            - node_modules/**
            - gentle-agents/**
            - auth.json
            - mcp-auth.json
            - antigravity-accounts.json
            - models-store.json
            - .git/**
            - .DS_Store
        secrets:
            - mcp.json
            - web-search.json
    herdr:
        description: Herdr terminal workspace and agent process manager
        profile: core,ai
        paths:
            - src: ~/.config/herdr/config.toml
              dest: configs/herdr/config.toml
            - src: ~/.config/herdr/plugins.json
              dest: configs/herdr/plugins.json
            - src: ~/.config/herdr/plugins
              dest: configs/herdr/plugins
            - src: ~/.local/state/herdr/client/endpoints.json
              dest: configs/herdr/endpoints.json
        exclude:
            - '*.sock*'
            - '*.log'
            - .plugins.lock
            - session-history.json
            - session-snapshots/**
            - 'plugins/.locks/**'
            - .DS_Store
        install:
            darwin:
                manager: brew
                package: herdr
            brew:
                manager: brew
                package: herdr
            yay:
                manager: yay
                package: herdr-bin
    terminal-browser:
        description: Terminal-based web browser companion for AI agents
        profile: core
        paths:
            - src: ~/.config/terminal-browser
              dest: configs/terminal-browser
        exclude:
            - .DS_Store
        install:
            darwin:
                manager: brew
                cask: terminal-browser
            linux:
                manager: brew
                cask: terminal-browser
            arch:
                manager: yay
                package: terminal-browser-bin
    btop:
        description: Resource monitor (C++ continuation of bashtop and bpytop)
        profile: core
        paths:
            - src: ~/.config/btop
              dest: configs/btop
        exclude:
            - .DS_Store
        install:
            darwin:
                manager: brew
                package: btop
            linux:
                manager: brew
                package: btop
            arch:
                manager: pacman
                package: btop
            debian:
                manager: apt
                package: btop
            ubuntu:
                manager: apt
                package: btop
    flashspace:
        description: Flashspace macOS workspace manager settings and profiles
        profile: core
        paths:
            - src: ~/.config/flashspace
              dest: configs/flashspace
        exclude:
            - .DS_Store
    gh:
        description: GitHub CLI configuration and preferences
        profile: core
        paths:
            - src: ~/.config/gh/config.yml
              dest: configs/gh/config.yml
            - src: ~/.config/gh/hosts.yml
              dest: configs/gh/hosts.yml
        secrets:
            - hosts.yml
        install:
            darwin:
                manager: brew
                package: gh
            brew:
                manager: brew
                package: gh
            pacman:
                manager: pacman
                package: github-cli
            apt:
                manager: apt
                package: gh
            dnf:
                manager: dnf
                package: gh
            winget:
                manager: winget
                package: GitHub.cli
            scoop:
                manager: scoop
                package: gh
    ghostty:
        description: Ghostty terminal emulator
        check: [ghostty, /Applications/Ghostty.app]
        paths:
            - src: ~/.config/ghostty
              dest: configs/ghostty
        exclude:
            - .DS_Store
        install:
            arch:
                manager: yay
                package: ghostty
            darwin:
                manager: brew
                cask: ghostty
            pacman:
                manager: pacman
                package: ghostty
    git:
        description: Git global configuration
        paths:
            - src: ~/.gitconfig
              dest: configs/git/.gitconfig
              keep_local: true
            - src: ~/.config/git
              dest: configs/git/config_dir
        exclude:
            - .DS_Store
        install:
            arch:
                manager: pacman
                package: git
            darwin:
                manager: brew
                package: git
            debian:
                manager: apt
                package: git
            ubuntu:
                manager: apt
                package: git
            brew:
                manager: brew
                package: git
            dnf:
                manager: dnf
                package: git
            zypper:
                manager: zypper
                package: git
            winget:
                manager: winget
                package: Git.Git
            scoop:
                manager: scoop
                package: git
    infra:
        description: Brewfile.infra (Caddy, mkcert and act are installed through their own apps)
        profile: infra
        paths:
            - src: Brewfile.infra
              dest: Brewfile.infra
    mobile:
        description: Brewfile.mobile (OpenJDK 17, CocoaPods and Fastlane are installed through their own apps)
        profile: mobile
        paths:
            - src: Brewfile.mobile
              dest: Brewfile.mobile
    android-studio:
        description: Android Studio IDE, SDK tools, and emulator (cross-platform)
        profile: mobile
        check: [android-studio, /Applications/Android Studio.app]
        install:
            darwin:
                manager: brew
                cask: android-studio
            ubuntu:
                manager: script
                command: sudo snap install android-studio --classic
            debian:
                manager: script
                command: sudo snap install android-studio --classic
            arch:
                manager: yay
                package: android-studio
    xcode:
        description: Apple Xcode command line developer tools (macOS only)
        profile: mobile
        check: [/Library/Developer/CommandLineTools, /Applications/Xcode.app]
        install:
            darwin:
                manager: script
                command: xcode-select -p &>/dev/null || xcode-select --install
    tailscale:
        description: Mesh VPN based on WireGuard for secure cross-device networking
        profile: core
        check: [tailscale, /Applications/Tailscale.app]
        install:
            darwin:
                manager: brew
                cask: tailscale
            ubuntu:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
            debian:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
            arch:
                manager: pacman
                package: tailscale
            winget:
                manager: winget
                package: Tailscale.Tailscale
            linux:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
    mongodb-compass:
        description: Interactive GUI tool for querying and analyzing MongoDB data
        profile: core
        optional: true
        check: [mongodb-compass, /Applications/MongoDB Compass.app]
        install:
            darwin:
                manager: brew
                cask: mongodb-compass
            arch:
                manager: yay
                package: mongodb-compass
    postman:
        description: Postman API testing platform (optional alternative to Bruno)
        profile: core
        optional: true
        check: [postman, /Applications/Postman.app]
        install:
            darwin:
                manager: brew
                cask: postman
            ubuntu:
                manager: script
                command: sudo snap install postman
            arch:
                manager: yay
                package: postman-bin
    nvim:
        description: Neovim editor and plugins
        paths:
            - src: ~/.config/nvim
              dest: configs/nvim
        exclude:
            - .git/**
            - .DS_Store
            - lazy-lock.json.backup
            - undo/**
        config_requires: [ripgrep]
        install:
            arch:
                manager: pacman
                package: neovim
            darwin:
                manager: brew
                package: neovim
            debian:
                manager: apt
                package: neovim
            ubuntu:
                manager: apt
                package: neovim
            brew:
                manager: brew
                package: neovim
            dnf:
                manager: dnf
                package: neovim
            zypper:
                manager: zypper
                package: neovim
            winget:
                manager: winget
                package: Neovim.Neovim
            scoop:
                manager: scoop
                package: neovim
    ollama:
        description: Ollama local AI runtime and models runner
        profile: ai
        optional: true
        check: [ollama, /Applications/Ollama.app]
        paths:
            - src: ~/.ollama
              dest: configs/ollama
        exclude:
            - models/**
            - blobs/**
            - manifests/**
            - '*.bin'
            - '*.gguf'
        install:
            darwin:
                manager: brew
                cask: ollama
            linux:
                manager: script
                command: curl -fsSL https://ollama.com/install.sh | sh
            pacman:
                manager: pacman
                package: ollama
            winget:
                manager: winget
                package: Ollama.Ollama
    pnpm:
        description: Fast, disk space efficient package manager
        paths: []
        provides: [pnpm]
        install:
            darwin:
                manager: brew
                package: pnpm
            linux:
                manager: script
                command: curl -fsSL https://get.pnpm.io/install.sh | sh -
            brew:
                manager: brew
                package: pnpm
            pacman:
                manager: pacman
                package: pnpm
            winget:
                manager: winget
                package: pnpm.pnpm
            scoop:
                manager: scoop
                package: pnpm
    skills:
        description: Agent skills catalog in ~/.agents/skills
        profile: core,ai
        paths:
            - src: ~/.agents/skills
              dest: configs/agents/skills
        exclude:
            - .git/**
            - .DS_Store
    ssh:
        description: SSH host aliases and configuration (excludes private keys)
        profile: core
        paths:
            - src: ~/.ssh/config
              dest: configs/ssh/config
        secrets:
            - config
        exclude:
            - id_*
            - '*.pub'
            - known_hosts*
            - digitalocean*
    zed:
        description: Zed Editor configurations, keymaps, and themes
        profile: core
        check: [zed, zeditor, /Applications/Zed.app]
        paths:
            - src: ~/.config/zed
              dest: configs/zed
        exclude:
            - .DS_Store
        install:
            darwin:
                manager: brew
                cask: zed
            pacman:
                manager: pacman
                package: zed
    zsh:
        description: Zsh shell configuration and Powerlevel10k theme
        profile: core
        paths:
            - src: ~/.zshrc
              dest: configs/zsh/.zshrc
            - src: ~/.p10k.zsh
              dest: configs/zsh/.p10k.zsh
            # Oh My Zsh custom folder: *.zsh files it sources, lib overrides,
            # functions and completions. Plugins and themes are installed
            # repositories (config_requires), and the examples ship with it.
            - src: ~/.oh-my-zsh/custom
              dest: configs/zsh/oh-my-zsh-custom
        exclude:
            - .zsh_history
            - .zsh_sessions/**
            - .zshrc.local*
            - plugins/**
            - themes/**
            - example.zsh
            - example.zsh-theme
            - '*.zwc'
            - .DS_Store
        config_requires: [powerlevel10k, zsh-autosuggestions, zsh-syntax-highlighting, fzf, fd, bat, zoxide, atuin, carapace]
        install:
            arch:
                manager: pacman
                package: zsh
            darwin:
                manager: brew
                package: zsh
            debian:
                manager: apt
                package: zsh
            ubuntu:
                manager: apt
                package: zsh
            brew:
                manager: brew
                package: zsh
            dnf:
                manager: dnf
                package: zsh
            zypper:
                manager: zypper
                package: zsh
    node:
        description: Node.js runtime (required by npm-based tools such as claude and codex)
        profile: core,ai,mobile,infra
        paths: []
        provides: [npm]
        install:
            brew:
                manager: brew
                package: node
            pacman:
                manager: pacman
                package: nodejs npm
            apt:
                manager: apt
                package: nodejs npm
            dnf:
                manager: dnf
                package: nodejs npm
            winget:
                manager: winget
                package: OpenJS.NodeJS.LTS
            scoop:
                manager: scoop
                package: nodejs-lts
    # Package-only inventory: every Brewfile declaration and config prerequisite
    # has exactly one owning app. See docs/install-inventory.md for sources.
    act:
        description: Run GitHub Actions locally
        profile: core,infra
        install:
            brew: {manager: brew, package: act}
            pacman: {manager: pacman, package: act}
            winget: {manager: winget, package: nektos.act}
    bat:
        description: cat clone with syntax highlighting (fzf previews)
        check: [bat, batcat]
        install:
            brew: {manager: brew, package: bat}
            pacman: {manager: pacman, package: bat}
            apt: {manager: apt, package: bat}
            dnf: {manager: dnf, package: bat}
            winget: {manager: winget, package: sharkdp.bat}
    bitwarden:
        description: Bitwarden desktop password manager
        check: [bitwarden, /Applications/Bitwarden.app]
        install:
            darwin: {manager: brew, cask: bitwarden}
            pacman: {manager: pacman, package: bitwarden}
