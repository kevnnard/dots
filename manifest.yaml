version: 1.0.0
dotfiles_dir: ~/.dotfiles
apps:
    atuin:
        description: Atuin shell history sync configuration
        profile: core
        paths:
            - src: ~/.config/atuin/config.toml
              dest: configs/atuin/config.toml
        install:
            darwin:
                manager: brew
                package: atuin
            brew:
                manager: brew
                package: atuin
            pacman:
                manager: pacman
                package: atuin
    brew:
        description: Core Homebrew bundle (CLI tools, fonts, GUIs)
        profile: core
        paths:
            - src: Brewfile
              dest: Brewfile
        install:
            darwin:
                manager: script
                command: brew bundle --file=Brewfile
    claude:
        description: Claude Code CLI settings, MCP servers, agents, and instructions
        profile: core,ai
        paths:
            - src: ~/.claude/settings.json
              dest: configs/claude/settings.json
            - src: ~/.claude/mcp.json
              dest: configs/claude/mcp.json
            - src: ~/.claude/CLAUDE.md
              dest: configs/claude/CLAUDE.md
            - src: ~/.claude/skills
              dest: configs/claude/skills
            - src: ~/.claude/agents
              dest: configs/claude/agents
        secrets:
            - mcp.json
        exclude:
            - session-env/**
            - sessions/**
            - history.jsonl
            - file-history/**
            - daemon.log
            - cache/**
            - backups/**
            - '*.tmp.*'
            - '*.backup'
            - .DS_Store
        requires:
            - node
        install:
            default:
                manager: npm
                package: "@anthropic-ai/claude-code"
    codex:
        description: Codex CLI configurations, hooks, agents, and rules
        profile: core,ai
        paths:
            - src: ~/.codex/config.toml
              dest: configs/codex/config.toml
            - src: ~/.codex/hooks.json
              dest: configs/codex/hooks.json
            - src: ~/.codex/AGENTS.md
              dest: configs/codex/AGENTS.md
            - src: ~/.codex/rules
              dest: configs/codex/rules
            - src: ~/.codex/skills
              dest: configs/codex/skills
            - src: ~/.codex/auth.json
              dest: configs/codex/auth.json
        exclude:
            - '*.sqlite*'
            - cache/**
            - sessions/**
            - archived_sessions/**
            - history.jsonl
            - models_cache.json
            - log/**
            - .tmp/**
            - .DS_Store
        secrets:
            - auth.json
        requires:
            - node
        install:
            default:
                manager: npm
                package: "@openai/codex"
    engram:
        description: Persistent cross-session memory engine for AI coding agents
        profile: core,ai
        paths:
            - src: ~/.engram/protocol-mode.json
              dest: configs/engram/protocol-mode.json
        exclude:
            - '*.db*'
            - '*.lock'
            - .instance-id*
        install:
            darwin:
                manager: brew
                package: gentleman-programming/tap/engram
            brew:
                manager: brew
                package: gentleman-programming/tap/engram
    gentle-ai:
        description: Gentle AI development workflow harness (ODD, SDD, 4R Review, Judgment Day)
        profile: core,ai
        paths:
            - src: ~/.gentle-ai/state.json
              dest: configs/gentle-ai/state.json
        exclude:
            - cache/**
            - backups/**
            - review-contexts/**
            - '*.lock'
            - .DS_Store
        install:
            darwin:
                manager: brew
                package: gentleman-programming/tap/gentle-ai
            brew:
                manager: brew
                package: gentleman-programming/tap/gentle-ai
    herdr:
        description: Herdr terminal workspace and agent process manager
        profile: core,ai
        paths:
            - src: ~/.config/herdr/config.toml
              dest: configs/herdr/config.toml
        exclude:
            - '*.sock*'
            - '*.log'
            - session-history.json
            - session-snapshots/**
            - .DS_Store
        install:
            darwin:
                manager: brew
                package: herdr
            brew:
                manager: brew
                package: herdr
    orca:
        description: Orca agent workspace and integration hooks
        profile: ai
        paths:
            - src: ~/.orca/agent-hooks
              dest: configs/orca/agent-hooks
        exclude:
            - '*.installed'
            - .DS_Store
    flashspace:
        description: Flashspace macOS workspace manager settings and profiles
        profile: core
        paths:
            - src: ~/.config/flashspace
              dest: configs/flashspace
        exclude:
            - .DS_Store
    gh:
        description: GitHub CLI configuration and preferences
        profile: core
        paths:
            - src: ~/.config/gh/config.yml
              dest: configs/gh/config.yml
            - src: ~/.config/gh/hosts.yml
              dest: configs/gh/hosts.yml
        secrets:
            - hosts.yml
        install:
            darwin:
                manager: brew
                package: gh
            brew:
                manager: brew
                package: gh
            pacman:
                manager: pacman
                package: github-cli
            apt:
                manager: apt
                package: gh
            dnf:
                manager: dnf
                package: gh
            winget:
                manager: winget
                package: GitHub.cli
            scoop:
                manager: scoop
                package: gh
    ghostty:
        description: Ghostty terminal emulator
        paths:
            - src: ~/.config/ghostty
              dest: configs/ghostty
        exclude:
            - .DS_Store
        install:
            arch:
                manager: yay
                package: ghostty
            darwin:
                manager: brew
                cask: ghostty
            pacman:
                manager: pacman
                package: ghostty
    git:
        description: Git global configuration
        paths:
            - src: ~/.gitconfig
              dest: configs/git/.gitconfig
            - src: ~/.config/git
              dest: configs/git/config_dir
        exclude:
            - .DS_Store
        install:
            arch:
                manager: pacman
                package: git
            darwin:
                manager: brew
                package: git
            debian:
                manager: apt
                package: git
            ubuntu:
                manager: apt
                package: git
            brew:
                manager: brew
                package: git
            dnf:
                manager: dnf
                package: git
            zypper:
                manager: zypper
                package: git
            winget:
                manager: winget
                package: Git.Git
            scoop:
                manager: scoop
                package: git
    infra:
        description: Local infrastructure & Actions testing (Caddy, mkcert, act)
        profile: infra
        paths:
            - src: Brewfile.infra
              dest: Brewfile.infra
        install:
            darwin:
                manager: script
                command: brew bundle --file=Brewfile.infra
    mobile:
        description: React Native & Mobile Build Toolchain (OpenJDK 17, CocoaPods, Fastlane)
        profile: mobile
        paths:
            - src: Brewfile.mobile
              dest: Brewfile.mobile
        install:
            darwin:
                manager: script
                command: brew bundle --file=Brewfile.mobile
    android-studio:
        description: Android Studio IDE, SDK tools, and emulator (cross-platform)
        profile: mobile
        install:
            darwin:
                manager: brew
                cask: android-studio
            ubuntu:
                manager: script
                command: sudo snap install android-studio --classic
            debian:
                manager: script
                command: sudo snap install android-studio --classic
            arch:
                manager: yay
                package: android-studio
    xcode:
        description: Apple Xcode command line developer tools (macOS only)
        profile: mobile
        install:
            darwin:
                manager: script
                command: xcode-select -p &>/dev/null || xcode-select --install
    tailscale:
        description: Mesh VPN based on WireGuard for secure cross-device networking
        profile: core
        install:
            darwin:
                manager: brew
                cask: tailscale
            ubuntu:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
            debian:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
            arch:
                manager: pacman
                package: tailscale
            winget:
                manager: winget
                package: Tailscale.Tailscale
            linux:
                manager: script
                command: curl -fsSL https://tailscale.com/install.sh | sh
    mongodb-compass:
        description: Interactive GUI tool for querying and analyzing MongoDB data
        profile: core
        optional: true
        install:
            darwin:
                manager: brew
                cask: mongodb-compass
            arch:
                manager: yay
                package: mongodb-compass
    postman:
        description: Postman API testing platform (optional alternative to Bruno)
        profile: core
        optional: true
        install:
            darwin:
                manager: brew
                cask: postman
            ubuntu:
                manager: script
                command: sudo snap install postman
            arch:
                manager: yay
                package: postman-bin
    nvim:
        description: Neovim editor and plugins
        paths:
            - src: ~/.config/nvim
              dest: configs/nvim
        exclude:
            - .git/**
            - .DS_Store
            - lazy-lock.json.backup
            - undo/**
        install:
            arch:
                manager: pacman
                package: neovim
            darwin:
                manager: brew
                package: neovim
            debian:
                manager: apt
                package: neovim
            ubuntu:
                manager: apt
                package: neovim
            brew:
                manager: brew
                package: neovim
            dnf:
                manager: dnf
                package: neovim
            zypper:
                manager: zypper
                package: neovim
            winget:
                manager: winget
                package: Neovim.Neovim
            scoop:
                manager: scoop
                package: neovim
    pi:
        description: Pi coding agent harness settings, models, MCP servers, skills, and agents
        profile: core,ai
        paths:
            - src: ~/.pi/agent/settings.json
              dest: configs/pi/settings.json
            - src: ~/.pi/agent/models.json
              dest: configs/pi/models.json
            - src: ~/.pi/agent/mcp.json
              dest: configs/pi/mcp.json
            - src: ~/.pi/agent/trust.json
              dest: configs/pi/trust.json
            - src: ~/.pi/agent/skills
              dest: configs/pi/skills
            - src: ~/.pi/agent/agents
              dest: configs/pi/agents
            - src: ~/.pi/agent/chains
              dest: configs/pi/chains
            - src: ~/.pi/agent/auth.json
              dest: configs/pi/auth.json
            - src: ~/.pi/agent/mcp-auth.json
              dest: configs/pi/mcp-auth.json
        exclude:
            - sessions/**
            - web-search-cache/**
            - cc-cli-logs/**
            - '*.log'
            - '*.tmp.*'
            - '*.cache.json'
            - crashes.json
            - npm/**
            - bin/**
            - node_modules/**
            - .git/**
            - .DS_Store
        secrets:
            - auth.json
            - mcp-auth.json
            - mcp.json
        requires:
            - node
        install:
            default:
                manager: npm
                package: "@earendil-works/pi-coding-agent"
    ollama:
        description: Ollama local AI runtime and models runner
        profile: ai
        optional: true
        paths:
            - src: ~/.ollama
              dest: configs/ollama
        exclude:
            - models/**
            - blobs/**
            - manifests/**
            - '*.bin'
            - '*.gguf'
        install:
            darwin:
                manager: brew
                cask: ollama
            linux:
                manager: script
                command: curl -fsSL https://ollama.com/install.sh | sh
            pacman:
                manager: pacman
                package: ollama
            winget:
                manager: winget
                package: Ollama.Ollama
    pnpm:
        description: Fast, disk space efficient package manager
        paths: []
        install:
            darwin:
                manager: brew
                package: pnpm
            linux:
                manager: script
                command: curl -fsSL https://get.pnpm.io/install.sh | sh -
            brew:
                manager: brew
                package: pnpm
            pacman:
                manager: pacman
                package: pnpm
            winget:
                manager: winget
                package: pnpm.pnpm
            scoop:
                manager: scoop
                package: pnpm
    skills:
        description: Agent skills catalog in ~/.agents/skills
        profile: core,ai
        paths:
            - src: ~/.agents/skills
              dest: configs/agents/skills
        exclude:
            - .git/**
            - .DS_Store
    ssh:
        description: SSH host aliases and configuration (excludes private keys)
        profile: core
        paths:
            - src: ~/.ssh/config
              dest: configs/ssh/config
        secrets:
            - config
        exclude:
            - id_*
            - '*.pub'
            - known_hosts*
            - digitalocean*
    zed:
        description: Zed Editor configurations, keymaps, and themes
        profile: core
        paths:
            - src: ~/.config/zed
              dest: configs/zed
        exclude:
            - .DS_Store
        install:
            darwin:
                manager: brew
                cask: zed
            pacman:
                manager: pacman
                package: zed
    zsh:
        description: Zsh shell configuration and Powerlevel10k theme
        profile: core
        paths:
            - src: ~/.zshrc
              dest: configs/zsh/.zshrc
            - src: ~/.p10k.zsh
              dest: configs/zsh/.p10k.zsh
        exclude:
            - .zsh_history
            - .zsh_sessions/**
        install:
            arch:
                manager: pacman
                package: zsh
            darwin:
                manager: brew
                package: zsh
            debian:
                manager: apt
                package: zsh
            ubuntu:
                manager: apt
                package: zsh
            brew:
                manager: brew
                package: zsh
            dnf:
                manager: dnf
                package: zsh
            zypper:
                manager: zypper
                package: zsh
    node:
        description: Node.js runtime (required by npm-based tools such as pi, claude and codex)
        profile: core,ai,mobile,infra
        paths: []
        install:
            brew:
                manager: brew
                package: node
            pacman:
                manager: pacman
                package: nodejs npm
            apt:
                manager: apt
                package: nodejs npm
            dnf:
                manager: dnf
                package: nodejs npm
            winget:
                manager: winget
                package: OpenJS.NodeJS.LTS
            scoop:
                manager: scoop
                package: nodejs-lts
