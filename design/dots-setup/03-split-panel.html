<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dots setup — split panel</title>
<style>
  :root {
    --bg: #1E1E2E; --text: #F8F8F2; --primary: #7D56F4; --secondary: #00D7D7;
    --success: #04B575; --warning: #FFB86C; --danger: #FF5555; --muted: #9AA3C7; --panel: #252637;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 100vh; }
  header { padding: 18px 24px; background: var(--primary); font-weight: 700; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 56px); }
  nav { background: var(--panel); padding: 16px; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav button { width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    font: inherit; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
  nav button[aria-current="step"] { background: var(--bg); color: var(--secondary); font-weight: 700; }
  nav button:focus-visible { outline: 3px solid var(--secondary); }
  .ok { color: var(--success); } .wait { color: var(--warning); } .mute { color: var(--muted); }
  section { padding: 28px 32px; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  .cmd { background: var(--panel); border-radius: 8px; padding: 14px 16px; margin: 16px 0; color: var(--secondary); }
  .verify { color: var(--muted); }
  .actions { margin-top: 24px; display: flex; gap: 10px; }
  button.action { font: inherit; color: var(--text); background: var(--primary); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button.action.alt { background: var(--panel); }
  button.action:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>dots setup</header>
<div class="layout">
  <nav aria-label="Setup steps">
    <ul>
      <li><button><span class="ok">✓</span> Default shell</button></li>
      <li><button><span class="ok">✓</span> zsh + powerlevel10k</button></li>
      <li><button><span class="wait">◦</span> Claude Code login</button></li>
      <li><button><span class="mute">◇</span> Copilot (Neovim)</button></li>
      <li><button aria-current="step"><span class="wait">▸</span> GitHub CLI login</button></li>
    </ul>
  </nav>
  <section aria-labelledby="step-title">
    <h2 id="step-title">GitHub CLI login</h2>
    <p class="mute">Runs in this terminal. You finish the browser or password prompt; dots never sees the token.</p>
    <div class="cmd">$ gh auth login</div>
    <p class="verify">Verified with: gh auth status</p>
    <div class="actions">
      <button class="action">Run this step</button>
      <button class="action alt">Skip for now</button>
    </div>
  </section>
</div>
</body>
</html>
